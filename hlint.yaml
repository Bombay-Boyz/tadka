# HLint configuration for tadka.
#
# Kept minimal and additive to `-Wall`/`-Wcompat`/etc. in tadka.cabal — hlint
# should catch idiom/style issues the compiler warnings can't, not duplicate
# them. Add exceptions here only with a comment explaining why; don't blanket-
# ignore a group of hints just to silence CI.

- arguments:
    - -XGHC2021

# GHC2021 already implies most of the extension-related hints (LambdaCase,
# TupleSections, etc. are opt-in per-module, not global here), so nothing
# extra is added on top of the source-level defaults in tadka.cabal.

# principles.docx calls for total functions and explicit Maybe/Either error
# handling (see CONTRIBUTING.md), so keep the standard partiality hints at
# their default (non-ignored) severity rather than downgrading them.

# Generated code: the width table is machine-generated (tools/gen-width-table.hs)
# and checked in, not hand-written; don't lint it.
- ignore: {name: "Use camelCase", within: "Tadka.Internal.Width.Table"}

# Test suites lean on tasty/hedgehog idioms (explicit `pure ()`-style
# do-blocks, deliberately literal fixtures) that aren't bugs; relax a couple
# of purely stylistic hints there only.
- ignore: {name: "Redundant bracket", within: [golden, props, interop]}
- ignore: {name: "Reduce duplication", within: [golden, props, interop]}

# Module export lists in Tadka.hs are long and grouped/commented by design
# (see the module's own Haddock); don't flag that as an export-list smell.
- ignore: {name: "Use explicit module export list"}
