name: CI

# Build + both test suites, each runnable independently. Every later phase adds
# fixtures/properties to the existing suites; none of them wait for Phase 11.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10.1'
          cabal-version: '3.16.1.0'

      - name: Freeze / configure
        run: cabal build --only-dependencies all --flags=werror

      - name: Build library
        run: cabal build all

      # Run each suite independently so a failure names the suite that broke.
      - name: Golden tests
        run: cabal test golden --test-show-details=direct

      - name: Property tests
        run: cabal test props --test-show-details=direct

      # Interop adapters live in separate sub-libraries so the core never
      # depends on a parser package; their round-trip tests run here.
      - name: Interop tests
        run: cabal test interop --test-show-details=direct

      # Phase 8 discipline (vision §6): every deriveDiagnostic-generated method
      # body must be a direct call to a shared function — no logic in the splice.
      - name: Generated-code discipline check
        run: sh tools/check-generated.sh

      # Phase 8: malformed deriveDiagnostic uses must fail at compile time.
      - name: Compile-fail tests
        run: sh tools/check-compile-fail.sh
